<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园留言板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>校园留言板</h1>
            <p class="subtitle">记录校园生活的点点滴滴</p>
        </header>

        <section class="post-form">
            <h2>写留言</h2>
            <div class="form-group">
                <input type="text" id="authorInput" placeholder="你的昵称" maxlength="50" required>
            </div>
            <div class="form-group">
                <textarea id="contentInput" placeholder="说点什么吧..." maxlength="500" rows="3" required></textarea>
                <span class="char-count"><span id="charCount">0</span>/500</span>
            </div>
            <button id="submitBtn" class="btn btn-primary">发布留言</button>
        </section>

        <section class="message-list">
            <h2>所有留言</h2>
            <div id="messagesContainer">
                <p class="loading">加载中...</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
